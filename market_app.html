<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Market Analysis - With Database</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --border: #e5e7eb;
      --muted: #6b7280;
      --accent: #4f46e5;
      --accent-weak: #eef2ff;
      --error: #b91c1c;
      --success: #16a34a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial,
        "Apple Color Emoji", "Segoe UI Emoji";
      background: var(--bg);
      color: #0f172a;
      line-height: 1.5;
    }
    .container {
      max-width: 1200px;
      margin: 32px auto;
      padding: 0 16px;
    }
    h1 {
      font-size: 1.5rem;
      margin: 0 0 16px 0;
      font-weight: 700;
    }
    h2 {
      font-size: 1.2rem;
      margin: 24px 0 12px 0;
      font-weight: 600;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      border-bottom: 2px solid var(--border);
    }
    .tab {
      padding: 10px 20px;
      background: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      cursor: pointer;
      font-weight: 500;
      color: var(--muted);
      transition: all 150ms;
    }
    .tab:hover {
      color: var(--accent);
    }
    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    /* Dropzone */
    #dropzone {
      border: 2px dashed #cbd5e1;
      border-radius: 14px;
      padding: 28px;
      background: var(--card);
      cursor: pointer;
      user-select: none;
      display: grid;
      place-items: center;
      gap: 6px;
      transition: border-color 120ms ease, background 120ms ease, box-shadow 120ms ease;
      outline: none;
    }
    #dropzone:hover { border-color: #a8b1c6; }
    #dropzone.highlight {
      border-color: var(--accent);
      background: var(--accent-weak);
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12) inset;
    }
    .dz-icon { font-size: 28px; }
    .dz-title { font-weight: 600; }
    .dz-subtitle { color: var(--muted); font-size: 0.95rem; }

    .message {
      padding: 12px 16px;
      margin: 12px 0;
      border-radius: 8px;
      font-size: 14px;
    }
    .message.error {
      background: #fee;
      color: var(--error);
      border: 1px solid #fcc;
    }
    .message.success {
      background: #efe;
      color: var(--success);
      border: 1px solid #cfc;
    }
    .message.info {
      background: #eef;
      color: var(--accent);
      border: 1px solid #ccf;
    }
    
    /* Table */
    .table-wrapper {
      margin-top: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .table-container {
      width: 100%;
      overflow: auto;
      max-height: 70vh;
    }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      position: sticky;
      top: 0;
      background: #f8fafc;
      z-index: 1;
      border-bottom: 1px solid var(--border);
    }
    th, td { padding: 10px 12px; font-size: 14px; text-align: left; white-space: nowrap; }
    td:first-child { white-space: normal; word-wrap: break-word; max-width: 200px; }
    tbody tr:nth-child(even) td { background: #fcfcfd; }
    tbody tr:hover td { background: #f7f8fb; }
    tbody tr { cursor: pointer; }

    .table-meta { padding: 10px 12px; color: var(--muted); font-size: 13px; border-bottom: 1px solid var(--border); }
    .row-muted td { color: var(--muted); background: #f9fafb !important; }
    .cell-growth-high { color: #16a34a; font-weight: 600; }
    .cell-growth-medium { color: #d2ae1b; font-weight: 600; }
    .cell-growth-low { color: #d1281f; font-weight: 600; }
    .row-color-green td { background: #ecfdf5 !important; color: #065f46; }
    .row-color-red td { background: #fef2f2 !important; color: #991b1b; }
    .row-color-blue td { background: #eff6ff !important; color: #1e40af; }
    .cell-negative { color: var(--error) !important; }
    .cell-positive { color: var(--success) !important; }
    .cell-mcap-gold { background: #fffbeb !important; color: #92400e; font-weight: 800; }
    .cell-mcap-silver { background: #f4f4f5 !important; color: #52525b; font-weight: 700; }

    /* Import list */
    .import-list {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .import-item {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 120ms;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .import-item:last-child {
      border-bottom: none;
    }
    .import-item:hover {
      background: #f7f8fb;
    }
    .import-item.selected {
      background: var(--accent-weak);
      border-left: 4px solid var(--accent);
    }
    .import-info {
      flex: 1;
    }
    .import-date {
      font-weight: 600;
      margin-bottom: 4px;
    }
    .import-meta {
      color: var(--muted);
      font-size: 13px;
    }
    .import-actions {
      display: flex;
      gap: 8px;
    }

    /* Buttons */
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 150ms;
    }
    .btn-primary {
      background: var(--accent);
      color: white;
    }
    .btn-primary:hover {
      background: #4338ca;
    }
    .btn-secondary {
      background: var(--border);
      color: #374151;
    }
    .btn-secondary:hover {
      background: #d1d5db;
    }

    /* Compare section */
    .compare-controls {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
      background: var(--card);
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .compare-controls select {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
    }
    .compare-controls .attribute-selectors {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-left: auto;
    }
    .compare-controls label.checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .compare-controls input[type="checkbox"] {
      cursor: pointer;
    }

    /* Chart styles */
    .chart-container {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      overflow-x: auto;
    }
    .date-bar {
      position: sticky;
      bottom: 0;
      background: #f8fafc;
      border-top: 1px solid var(--border);
      padding: 8px 12px;
      font-size: 13px;
      color: #374151;
      z-index: 10;
    }
    .chart-row {
      display: flex;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      min-height: 60px;
    }
    .chart-row:last-child {
      border-bottom: none;
    }
    .chart-label {
      width: 200px;
      min-width: 200px;
      padding-right: 16px;
      font-weight: 500;
      font-size: 14px;
      white-space: normal;
      word-wrap: break-word;
    }
    .chart-bars {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 400px;
    }
    .chart-bar-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .chart-bar-label {
      min-width: 80px;
      font-size: 12px;
      color: var(--muted);
      text-align: right;
    }
    .chart-bar-wrapper {
      flex: 1;
      height: 24px;
      background: #f3f4f6;
      border-radius: 4px;
      position: relative;
      overflow: hidden;
    }
    .chart-bar {
      height: 100%;
      border-radius: 4px;
      transition: width 0.3s ease;
      display: flex;
      align-items: center;
      padding: 0 8px;
      font-size: 12px;
      font-weight: 600;
      color: white;
      white-space: nowrap;
    }
    .chart-bar.current-1 { background: #3b82f6; }
    .chart-bar.current-2 { background: #8b5cf6; }
    .chart-bar.growth-1 { background: #10b981; }
    .chart-bar.growth-2 { background: #14b8a6; }
    .chart-bar.appeal-1 { background: #f59e0b; }
    .chart-bar.appeal-2 { background: #ef4444; }
    .chart-bar.change { background: var(--accent); }
    .chart-bar.change.negative { background: var(--error); }
    .chart-bar.change.positive { background: var(--success); }
    .chart-legend {
      display: flex;
      gap: 20px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      padding: 12px;
      background: #f9fafb;
      border-radius: 8px;
    }
    .chart-legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
    }
    .chart-legend-color {
      width: 16px;
      height: 16px;
      border-radius: 3px;
    }
    .chart-echarts {
      width: 100%;
      height: 120px;
      min-width: 600px;
    }

    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Market Analysis - With Database</h1>

    <div class="tabs">
      <button class="tab active" data-tab="upload">Upload Data</button>
      <button class="tab" data-tab="history">History</button>
      <button class="tab" data-tab="compare">Compare</button>
    </div>

    <!-- Upload Tab -->
    <div id="upload-tab" class="tab-content active">
      <div id="dropzone" tabindex="0" role="button" aria-label="Drop a JSON file here or press Enter/Space to choose a file">
        <div class="dz-icon" aria-hidden="true">📄</div>
        <div class="dz-title">Drop a JSON file here</div>
        <div class="dz-subtitle">or click to choose a file</div>
        <input type="file" id="fileInput" accept="application/json,.json" hidden />
      </div>

      <div id="messages"></div>

      <section id="results" class="table-wrapper" style="display:none;">
        <div id="meta" class="table-meta"></div>
        <div id="tableContainer" class="table-container"></div>
      </section>
    </div>

    <!-- History Tab -->
    <div id="history-tab" class="tab-content">
      <h2>Import History</h2>
      <div id="importList"></div>
      <div id="historyResults" style="margin-top: 16px;"></div>
    </div>

    <!-- Compare Tab -->
    <div id="compare-tab" class="tab-content">
      <h2>Compare Imports</h2>
      <div class="compare-controls">
        <div class="attribute-selectors">
          <label class="checkbox-label">
            <input type="checkbox" id="attrCurrent" checked> Current
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="attrChange" checked> Change %
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="attrGrowth"> Growth
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="attrAppeal"> Appeal
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="attrTarget"> Target
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="attrRelative"> Relative %
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="attrBuy"> Buy %
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="attrHold"> Hold %
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="attrSell"> Sell %
          </label>
        </div>
      </div>
      <div id="compareResults"></div>
    </div>
  </main>
  <div id="compareDateBar" class="date-bar" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <script>
    (function () {
      'use strict';

      const API_BASE = '/api';
      
      const dropzone = document.getElementById('dropzone');
      const fileInput = document.getElementById('fileInput');
      let tableContainer = document.getElementById('tableContainer');
      const messages = document.getElementById('messages');
      const results = document.getElementById('results');
      const meta = document.getElementById('meta');

      let currentFile = null;

      // Tab switching
      document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
          const tabName = tab.dataset.tab;
          switchTab(tabName);
        });
      });

      function switchTab(tabName) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');
        document.getElementById(`${tabName}-tab`).classList.add('active');

        if (tabName === 'history') {
          loadImportHistory();
        } else if (tabName === 'compare') {
          loadTimeseries();
        }
      }

      // File upload handlers
      const preventDefaults = (e) => { e.preventDefault(); e.stopPropagation(); };

      ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(ev => {
        dropzone.addEventListener(ev, preventDefaults, false);
      });
      ['dragenter', 'dragover'].forEach(ev => {
        dropzone.addEventListener(ev, () => dropzone.classList.add('highlight'));
      });
      ['dragleave', 'drop'].forEach(ev => {
        dropzone.addEventListener(ev, () => dropzone.classList.remove('highlight'));
      });

      dropzone.addEventListener('click', () => fileInput.click());
      dropzone.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          fileInput.click();
        }
      });

      dropzone.addEventListener('drop', (e) => {
        const dt = e.dataTransfer;
        if (!dt || !dt.files || dt.files.length === 0) return;
        handleFile(dt.files[0]);
      });

      fileInput.addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (file) handleFile(file);
      });

      function handleFile(file) {
        clearUI();
        currentFile = file;

        if (!file.name.toLowerCase().endsWith('.json')) {
          showMessage('Please provide a .json file.', 'error');
          return;
        }

        const reader = new FileReader();
        reader.onload = () => {
          try {
            const text = String(reader.result || '').replace(/^\uFEFF/, '').trim();
            const data = JSON.parse(text);
            renderTableFromData(data);
            uploadToBackend(file, data);
          } catch (err) {
            showMessage('Invalid JSON: ' + (err && err.message ? err.message : String(err)), 'error');
          }
        };
        reader.onerror = () => showMessage('Could not read the file.', 'error');
        reader.readAsText(file);
      }

      async function uploadToBackend(file, data) {
        try {
          // Get file creation date (lastModified is the best we can do in browser)
          const fileDate = new Date(file.lastModified);
          
          showMessage('Uploading to database...', 'info');
          
          const response = await fetch(`${API_BASE}/upload`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              file_date: fileDate.toISOString(),
              data: Array.isArray(data) ? data : [data]
            })
          });

          const result = await response.json();
          
          if (response.ok) {
            showMessage(`✓ Data saved successfully! Import ID: ${result.import_id}, Records: ${result.records_count}`, 'success');
          } else {
            showMessage(`Upload failed: ${result.error}`, 'error');
          }
        } catch (err) {
          showMessage(`Upload error: ${err.message}`, 'error');
        }
      }

      async function loadImportHistory() {
        const listContainer = document.getElementById('importList');
        listContainer.innerHTML = '<div class="loading">Loading imports...</div>';

        try {
          const response = await fetch(`${API_BASE}/imports`);
          const imports = await response.json();

          if (!response.ok) {
            listContainer.innerHTML = `<div class="message error">Error: ${imports.error}</div>`;
            return;
          }

          if (imports.length === 0) {
            listContainer.innerHTML = '<div class="message info">No imports found. Upload some data first!</div>';
            return;
          }

          const listHTML = imports.map(imp => `
            <div class="import-item" data-id="${imp.id}" onclick="viewImport(${imp.id})">
              <div class="import-info">
                <div class="import-date">📅 ${new Date(imp.file_date).toLocaleString()}</div>
                <div class="import-meta">
                  ${imp.record_count} records | Imported: ${new Date(imp.import_date).toLocaleString()}
                </div>
              </div>
              <div class="import-actions">
                <button class="btn btn-secondary" onclick="event.stopPropagation(); viewImport(${imp.id})">View</button>
              </div>
            </div>
          `).join('');

          listContainer.innerHTML = `<div class="import-list">${listHTML}</div>`;
        } catch (err) {
          listContainer.innerHTML = `<div class="message error">Failed to load imports: ${err.message}</div>`;
        }
      }

      window.viewImport = async function(importId) {
        const resultsContainer = document.getElementById('historyResults');
        resultsContainer.innerHTML = '<div class="loading">Loading import data...</div>';

        try {
          const response = await fetch(`${API_BASE}/imports/${importId}`);
          const data = await response.json();

          if (!response.ok) {
            resultsContainer.innerHTML = `<div class="message error">Error: ${data.error}</div>`;
            return;
          }

          // Highlight selected import
          document.querySelectorAll('.import-item').forEach(item => {
            item.classList.remove('selected');
          });
          document.querySelector(`[data-id="${importId}"]`)?.classList.add('selected');

          // Convert records to format expected by renderTable
          const tableData = data.records.map(r => r.raw_data);
          
          const wrapper = document.createElement('div');
          wrapper.className = 'table-wrapper';
          const metaDiv = document.createElement('div');
          metaDiv.className = 'table-meta';
          metaDiv.textContent = `Import from ${new Date(data.import_info.file_date).toLocaleString()} | ${data.records.length} records`;
          
          const tableDiv = document.createElement('div');
          tableDiv.className = 'table-container';
          
          wrapper.appendChild(metaDiv);
          wrapper.appendChild(tableDiv);
          resultsContainer.innerHTML = '';
          resultsContainer.appendChild(wrapper);

          renderTableInContainer(tableDiv, tableData);
        } catch (err) {
          resultsContainer.innerHTML = `<div class="message error">Failed to load import: ${err.message}</div>`;
        }
      };

      let timeSeriesData = null;

      async function loadTimeseries() {
        const resultsContainer = document.getElementById('compareResults');
        resultsContainer.innerHTML = '<div class="loading">Loading time series...</div>';
        try {
          const res = await fetch(`${API_BASE}/timeseries`);
          const data = await res.json();
          if (!res.ok) {
            resultsContainer.innerHTML = `<div class="message error">Error: ${data.error}</div>`;
            return;
          }
          timeSeriesData = data;
          applySavedAttributes();
          attachAttributeListeners();
          renderTimeseriesCompare(resultsContainer);
        } catch (err) {
          resultsContainer.innerHTML = `<div class="message error">Failed to load time series: ${err.message}</div>`;
        }
      }

      function attachAttributeListeners() {
        ['attrCurrent','attrChange','attrGrowth','attrAppeal','attrTarget','attrRelative','attrBuy','attrHold','attrSell'].forEach(id => {
          const el = document.getElementById(id);
          if (el && !el.__bound) {
            el.addEventListener('change', () => {
              const container = document.getElementById('compareResults');
              saveAttributeSelections();
              renderTimeseriesCompare(container);
            });
            el.__bound = true;
          }
        });
      }

      // Cookie utilities for attribute selections
      function setCookie(name, value, days) {
        try {
          const d = new Date();
          d.setTime(d.getTime() + (days*24*60*60*1000));
          const expires = "expires=" + d.toUTCString();
          document.cookie = `${name}=${encodeURIComponent(value)};${expires};path=/;SameSite=Lax`;
        } catch {}
      }
      function getCookie(name) {
        try {
          const cname = name + "=";
          const ca = document.cookie.split(';');
          for (let c of ca) {
            while (c.charAt(0) === ' ') c = c.substring(1);
            if (c.indexOf(cname) === 0) return decodeURIComponent(c.substring(cname.length, c.length));
          }
        } catch {}
        return null;
      }
      function saveAttributeSelections() {
        const state = {
          current: !!document.getElementById('attrCurrent')?.checked,
          target: !!document.getElementById('attrTarget')?.checked,
          change: !!document.getElementById('attrChange')?.checked,
          growth: !!document.getElementById('attrGrowth')?.checked,
          relative: !!document.getElementById('attrRelative')?.checked,
          buy: !!document.getElementById('attrBuy')?.checked,
          hold: !!document.getElementById('attrHold')?.checked,
          sell: !!document.getElementById('attrSell')?.checked,
          appeal: !!document.getElementById('attrAppeal')?.checked
        };
        setCookie('compare_attrs', JSON.stringify(state), 180);
      }
      function applySavedAttributes() {
        const raw = getCookie('compare_attrs');
        if (!raw) return;
        try {
          const state = JSON.parse(raw);
          const map = {
            attrCurrent: 'current',
            attrTarget: 'target',
            attrChange: 'change',
            attrGrowth: 'growth',
            attrRelative: 'relative',
            attrBuy: 'buy',
            attrHold: 'hold',
            attrSell: 'sell',
            attrAppeal: 'appeal'
          };
          for (const id in map) {
            const el = document.getElementById(id);
            if (el && Object.prototype.hasOwnProperty.call(state, map[id])) {
              el.checked = !!state[map[id]];
            }
          }
        } catch {}
      }

      let echartsInstances = [];
      let resizeHandler = null;
      function disposeCharts() {
        for (const inst of echartsInstances) {
          try { inst.dispose(); } catch {}
        }
        echartsInstances = [];
      }

      function renderTimeseriesCompare(container) {
        if (!timeSeriesData) return;
        const dates = timeSeriesData.dates;
        const series = timeSeriesData.series;

        const showCurrent = document.getElementById('attrCurrent').checked;
        const showChange = document.getElementById('attrChange').checked;
        const showGrowth = document.getElementById('attrGrowth').checked;
        const showAppeal = document.getElementById('attrAppeal').checked;
        const showTarget = document.getElementById('attrTarget').checked;
        const showRelative = document.getElementById('attrRelative').checked;
        const showBuy = document.getElementById('attrBuy').checked;
        const showHold = document.getElementById('attrHold').checked;
        const showSell = document.getElementById('attrSell').checked;

        const activeKeys = [];
        if (showCurrent) activeKeys.push('current');
        if (showTarget) activeKeys.push('target');
        if (showChange) activeKeys.push('change');
        if (showGrowth) activeKeys.push('growth');
        if (showRelative) activeKeys.push('relative');
        if (showBuy) activeKeys.push('buy');
        if (showHold) activeKeys.push('hold');
        if (showSell) activeKeys.push('sell');
        if (showAppeal) activeKeys.push('appeal');

        if (activeKeys.length === 0) {
          container.innerHTML = '<div class="message info">Select at least one attribute to display</div>';
          return;
        }

        const colorMap = {
          current: '#3b82f6',
          target: '#7c3aed',
          change: '#4f46e5',
          growth: '#10b981',
          relative: '#06b6d4',
          buy: '#22c55e',
          hold: '#9ca3af',
          sell: '#ef4444',
          appeal: '#f59e0b'
        };

        const wrapper = document.createElement('div');
        wrapper.className = 'chart-container';

        // Legend
        const legend = document.createElement('div');
        legend.className = 'chart-legend';
        activeKeys.forEach(k => {
          const item = document.createElement('div');
          item.className = 'chart-legend-item';
          const c = document.createElement('div');
          c.className = 'chart-legend-color';
          c.style.backgroundColor = colorMap[k];
          const t = document.createElement('span');
          t.textContent = k.charAt(0).toUpperCase() + k.slice(1);
          item.appendChild(c);
          item.appendChild(t);
          legend.appendChild(item);
        });
        wrapper.appendChild(legend);

        // Dispose previous charts before re-rendering
        disposeCharts();

        // Helper to update the sticky date bar
        const dateBar = document.getElementById('compareDateBar');
        const updateDateBar = (idxOrLabel) => {
          let label = '';
          if (typeof idxOrLabel === 'number') {
            label = dates[idxOrLabel] != null ? String(dates[idxOrLabel]) : '';
          } else {
            label = String(idxOrLabel);
          }
          if (label) {
            const dt = new Date(label);
            dateBar.textContent = 'Date: ' + (isNaN(dt.getTime()) ? label : dt.toLocaleString());
          }
        };

        // Mount container before initializing charts so ECharts can measure sizes
        container.innerHTML = '';
        container.appendChild(wrapper);

        // Rows
        series.forEach(s => {
          const row = document.createElement('div');
          row.className = 'chart-row';
          const label = document.createElement('div');
          label.className = 'chart-label';
          const labelLink = document.createElement('a');
          labelLink.href = '/stock_history.html?name=' + encodeURIComponent(s.name);
          labelLink.target = '_blank';
          labelLink.rel = 'noopener noreferrer';
          labelLink.textContent = s.name;
          label.appendChild(labelLink);
          row.appendChild(label);

          const chartHolder = document.createElement('div');
          chartHolder.className = 'chart-echarts';
          row.appendChild(chartHolder);
          wrapper.appendChild(row);

          const pointMap = new Map(s.points.map(p => [String(p.date), p]));

          const axisTypes = [];
          const keyAxisIndex = {};
          const ensureAxis = (type) => {
            let idx = axisTypes.indexOf(type);
            if (idx === -1) { axisTypes.push(type); idx = axisTypes.length - 1; }
            return idx;
          };
          const getAxisForKey = (key) => {
            if (key === 'current' || key === 'target') return ensureAxis('value');
            if (key === 'change' || key === 'growth' || key === 'relative' || key === 'buy' || key === 'hold' || key === 'sell') return ensureAxis('percent');
            return ensureAxis('score');
          };

          const seriesOptions = activeKeys.map(key => {
            const data = dates.map(d => {
              const pt = pointMap.get(String(d));
              const v = pt ? pt[key] : null;
              return (typeof v === 'number' && isFinite(v)) ? v : null;
            });
            const yAxisIndex = getAxisForKey(key);
            return {
              name: key.charAt(0).toUpperCase() + key.slice(1),
              type: 'line',
              smooth: true,
              showSymbol: false,
              data,
              connectNulls: true,
              emphasis: { focus: 'series' },
              lineStyle: { width: 2, color: colorMap[key] },
              itemStyle: { color: colorMap[key] },
              yAxisIndex
            };
          });

        const chart = echarts.init(chartHolder);
        const option = {
          animation: true,
          grid: { left: 48, right: 48, top: 10, bottom: 24, containLabel: false },
          tooltip: {
            trigger: 'axis',
            axisPointer: { type: 'cross', snap: true, label: { show: true, backgroundColor: '#111827' } },
            formatter: (params) => {
              if (!params || !params.length) return '';
              const dateLabel = params[0].axisValueLabel;
              updateDateBar(dateLabel);
              const parts = [`<div><strong>${s.name}</strong> — ${dateLabel}</div>`];
              for (const p of params) {
                const key = (p.seriesName || '').toLowerCase();
                let suffix = '';
                if (key.includes('change') || key.includes('growth') || key.includes('relative') || key.includes('buy') || key.includes('hold') || key.includes('sell')) suffix = '%';
                const v = (p.value == null ? '' : Number(p.value).toFixed(2) + suffix);
                parts.push(`<div style="display:flex;gap:8px;align-items:center;"><span style="display:inline-block;width:10px;height:10px;background:${p.color};border-radius:2px;"></span>${p.seriesName}: ${v}</div>`);
              }
              return parts.join('');
            }
          },
          xAxis: {
            type: 'category',
            data: dates,
            axisTick: { show: false },
            axisLine: { lineStyle: { color: '#cbd5e1' } },
            axisLabel: {
              color: '#6b7280',
              formatter: (v) => {
                const d = new Date(v);
                return isNaN(d.getTime()) ? v : (d.toLocaleDateString());
              }
            }
          },
          yAxis: (function(){
            const axes = [];
            for (const type of axisTypes) {
              if (type === 'percent') {
                axes.push({ type: 'value', axisLine: { show: false }, splitLine: { lineStyle: { color: '#e5e7eb' } }, axisLabel: { color: '#6b7280', formatter: (v) => v + '%' } });
              } else if (type === 'value') {
                axes.push({ type: 'value', axisLine: { show: false }, splitLine: { lineStyle: { color: '#e5e7eb' } }, axisLabel: { color: '#6b7280' } });
              } else {
                axes.push({ type: 'value', axisLine: { show: false }, splitLine: { lineStyle: { color: '#e5e7eb' } }, axisLabel: { color: '#6b7280' } });
              }
            }
            return axes.length ? axes : [{ type: 'value' }];
          })(),
          series: seriesOptions
        };

        chart.setOption(option);
        try { chart.resize(); } catch {}
        chart.group = 'tsGroup';
        chart.on('updateAxisPointer', (e) => {
          const info = e.axesInfo && e.axesInfo[0];
          if (info) {
            const idx = typeof info.value === 'number' ? info.value : info.dataIndex;
            updateDateBar(idx != null ? idx : info.value);
          }
        });

        echartsInstances.push(chart);
        });

        // Connect charts for synchronized crosshair/tooltips
        try { echarts.connect('tsGroup'); } catch {}

        // Initial date bar to last date
        if (dates && dates.length) {
          const last = dates[dates.length - 1];
          const dt = new Date(last);
          document.getElementById('compareDateBar').textContent = 'Date: ' + (isNaN(dt.getTime()) ? String(last) : dt.toLocaleString());
        }

        // Resize charts on window resize
        if (resizeHandler) {
          window.removeEventListener('resize', resizeHandler);
        }
        resizeHandler = () => {
          for (const inst of echartsInstances) {
            try { inst.resize(); } catch {}
          }
        };
        window.addEventListener('resize', resizeHandler);

        // Force initial layout after mounting
        try {
          requestAnimationFrame(() => {
            for (const inst of echartsInstances) {
              try { inst.resize(); } catch {}
            }
          });
          setTimeout(() => {
            for (const inst of echartsInstances) {
              try { inst.resize(); } catch {}
            }
          }, 0);
        } catch {}
      }

      function clearUI() {
        messages.innerHTML = '';
        tableContainer.innerHTML = '';
        results.style.display = 'none';
        meta.textContent = '';
      }

      function showMessage(msg, type = 'info') {
        const div = document.createElement('div');
        div.className = `message ${type}`;
        div.textContent = msg;
        messages.innerHTML = '';
        messages.appendChild(div);
      }

      function renderTableFromData(data) {
        const frag = document.createDocumentFragment();
        let table, rowsCount = 0, colsCount = 0, maxGrowthOverall = NaN, maxAppealOverall = NaN;

        if (Array.isArray(data)) {
          if (data.length === 0) {
            tableContainer.textContent = 'Array is empty.';
            results.style.display = '';
            meta.textContent = '0 rows';
            return;
          }

          const first = data[0];
          const isObject = isPlainObject(first);
          if (isObject) {
            let columns = gatherColumns(data);
            if (!columns.includes('growth')) columns.push('growth');
            if (!columns.includes('appeal')) columns.push('appeal');

            const computed = data.map((item) => {
              const trendText = item.trend.replace('trTrendArrow -xsmall -', '').replace(' trPerformanceMeter__arrow', '');
              const trend = trendText == 'positive' ? +1 : trendText == 'negative' ? -1 : 0;
              const currentNum = toNumber(item.current);
              const targetNum = toNumber(item.target);
              const hasCT = Number.isFinite(currentNum) && Number.isFinite(targetNum) && currentNum !== 0;
              const growthVal = hasCT ? targetNum / currentNum : NaN;
              const relativeNum = toNumber(item.relative)*trend;
              const absoluteNum = toNumber(item.absolute)*trend;

              const b = toNumber(item.buy);
              const h = toNumber(item.hold);
              const s = toNumber(item.sell);
              const buyVal = Number.isFinite(b) ? b : 0;
              const holdVal = Number.isFinite(h) ? h : 0;
              const sellVal = Number.isFinite(s) ? s : 0;
              const appealBase = (buyVal * 3 + holdVal - sellVal * 3)*3/700;
              return {
                item,
                growthVal,
                relativeNum,
                absoluteNum,
                appealBase,
                muted: !hasCT
              };
            });

            const maxGrowth = computed.reduce((m, e) => (Number.isFinite(e.growthVal) && e.growthVal > m ? e.growthVal : m), 0);
            for (const e of computed) {
              e.appealVal = (Number.isFinite(e.appealBase) && maxGrowth > 0) ? (100*e.appealBase / maxGrowth) : e.appealBase;
            }
            maxGrowthOverall = Number.isFinite(maxGrowth) ? maxGrowth : NaN;
            maxAppealOverall = computed.reduce((m, e) => (Number.isFinite(e.appealVal) && e.appealVal > m ? e.appealVal : m), -Infinity);
            computed.sort((a, b) => b.appealVal - a.appealVal);

            const rows = computed.map(entry =>
              columns.map(col => {
                if (col === 'growth') {
                    const n = Number.isFinite(entry.growthVal) ? (entry.growthVal * 100) : NaN;
                    return { text: formatPercent(n), className: (Number.isFinite(n) && n > 120) ? 'cell-growth-high' : (Number.isFinite(n) && n > 100) ? 'cell-growth-medium' : 'cell-growth-low'  };
                }
                if (col === 'relative') {
                  const n = Number.isFinite(entry.relativeNum) ? (entry.relativeNum) : NaN;
                  return { text: formatPercent(n, 2), className: (Number.isFinite(n) && n < 0) ? 'cell-negative' : 'cell-positive' };
                }
                if (col === 'absolute') {
                  const n = Number.isFinite(entry.absoluteNum) ? (entry.absoluteNum) : NaN;
                  return { text: formatMoney(n, entry.item.absolute), className: (Number.isFinite(n) && n < 0) ? 'cell-negative' : 'cell-positive' };
                }
                if (col === 'appeal') {
                    const n = Number.isFinite(entry.appealVal) ? (entry.appealVal) : NaN;
                    return { text: formatPercent(n, 2), title: Number.isFinite(entry.appealBase) ? String(entry.appealBase) : '' };
                }
                if (col === 'current') {
                  const n = toNumber(entry.item.current);
                  return formatMoney(n, entry.item.current);
                }
                if (col === 'target') {
                  const n = toNumber(entry.item.target);
                  return formatMoney(n, entry.item.target);
                }
                if (col === 'buy' || col === 'hold' || col === 'sell') {
                  const n = toNumber(entry.item[col]);
                  return formatPercent(n, 0);
                }
                if (col === 'daily_change') {
                  const n = toNumber(entry.item['daily_change']);
                  return formatPercent(n, 2);
                }
                if (col === 'cap') {
                  const raw = entry.item[col];
                  const text = valueToCell(raw);
                  if (typeof raw === 'string') {
                    const trimmed = raw.trim();
                    const cls = /t$/i.test(trimmed) ? 'cell-mcap-gold' : (/b$/i.test(trimmed) ? 'cell-mcap-silver' : '');
                    return { text, className: cls };
                  }
                  return text;
                }
                return valueToCell(entry.item[col]);
              })
            );

            const mutedSet = new Set();
            computed.forEach((entry, i) => { if (entry.muted) mutedSet.add(i); });

            rowsCount = rows.length; colsCount = columns.length;
            const rowNames = computed.map(e => (e.item && e.item.name != null) ? String(e.item.name) : '');
            table = buildTable(columns, rows, { mutedRowIndices: mutedSet, rowNames });
            frag.appendChild(table);
          } else {
            const columns = ['value'];
            const rows = data.map(v => [valueToCell(v)]);
            rowsCount = rows.length; colsCount = 1;
            table = buildTable(columns, rows);
            frag.appendChild(table);
          }
        } else if (isPlainObject(data)) {
          const columns = ['key', 'value'];
          const rows = Object.keys(data).map(k => [k, valueToCell(data[k])]);
          rowsCount = rows.length; colsCount = 2;
          table = buildTable(columns, rows);
          frag.appendChild(table);
        } else {
          const columns = ['value'];
          const rows = [[valueToCell(data)]];
          rowsCount = 1; colsCount = 1;
          table = buildTable(columns, rows);
          frag.appendChild(table);
        }

        tableContainer.appendChild(frag);
        results.style.display = '';
        const metaParts = [`${rowsCount.toLocaleString()} row${rowsCount === 1 ? '' : 's'}`];
        if (Number.isFinite(maxGrowthOverall)) metaParts.push(`max growth: ${maxGrowthOverall.toFixed(2)}`);
        if (Number.isFinite(maxAppealOverall)) metaParts.push(`max appeal: ${maxAppealOverall.toFixed(2)} %`);
        meta.textContent = metaParts.join(' · ');
      }

      function renderTableInContainer(container, data) {
        const originalContainer = tableContainer;
        tableContainer = container;
        renderTableFromData(data);
        tableContainer = originalContainer;
      }

      function isPlainObject(obj) {
        return Object.prototype.toString.call(obj) === '[object Object]';
      }

      function gatherColumns(arr) {
        const cols = [];
        const seen = new Set();
        for (const item of arr) {
          if (isPlainObject(item)) {
            for (const key of Object.keys(item)) {
              if (key === 'trend') continue;
              if (!seen.has(key)) {
                seen.add(key);
                cols.push(key);
              }
            }
          }
        }
        return cols;
      }

      function buildTable(headers, rows, opts) {
        const table = document.createElement('table');
        const thead = document.createElement('thead');
        const trh = document.createElement('tr');
        for (const h of headers) {
          const th = document.createElement('th');
          th.textContent = h;
          trh.appendChild(th);
        }
        thead.appendChild(trh);
        table.appendChild(thead);

        const tbody = document.createElement('tbody');
        const mutedSet = opts && opts.mutedRowIndices ? opts.mutedRowIndices : null;
        const rowNames = opts && opts.rowNames ? opts.rowNames : null;
        const nameColIndex = headers.indexOf('name');
        for (let i = 0; i < rows.length; i++) {
          const row = rows[i];
          const tr = document.createElement('tr');
          if (mutedSet && mutedSet.has(i)) tr.classList.add('row-muted');
          for (let j = 0; j < row.length; j++) {
            const cell = row[j];
            const td = document.createElement('td');
            if (j === nameColIndex) {
              let text = '';
              if (cell && typeof cell === 'object' && 'text' in cell) {
                text = String(cell.text || '');
                if (cell.className) td.classList.add(cell.className);
                if (cell.title) td.title = cell.title;
              } else {
                text = String(cell ?? '');
              }
              const a = document.createElement('a');
              a.href = '/stock_history.html?name=' + encodeURIComponent(text);
              a.target = '_blank';
              a.rel = 'noopener noreferrer';
              a.textContent = text;
              td.appendChild(a);
            } else if (cell && typeof cell === 'object' && 'text' in cell) {
              td.textContent = cell.text;
              if (cell.title) td.title = cell.title;
              if (cell.className) td.classList.add(cell.className);
            } else {
              td.textContent = cell;
            }
            tr.appendChild(td);
          }
          tbody.appendChild(tr);
        }
        table.appendChild(tbody);
        return table;
      }

      function valueToCell(v) {
        if (v == null) return '';
        if (typeof v === 'object') {
          try { return JSON.stringify(v); } catch { return String(v); }
        }
        return String(v);
      }
      function toNumber(val) {
        if (typeof val === 'number' && Number.isFinite(val)) return val;
        if (typeof val !== 'string') return NaN;
        let s = val.trim();
        if (!s) return NaN;
        s = s
          .replace(/\u00A0/g, ' ')
          .replace(/[€%$]/g, '')
          .replace(/,/g, '')
          .replace(/[^0-9.\-]/g, '');
        if (s === '' || s === '-' || s === '—') return NaN;
        const n = parseFloat(s);
        return Number.isFinite(n) ? n : NaN;
      }

      function formatMoney(n, original) {
        if (!Number.isFinite(n)) return '';
        const sym = detectCurrencySymbol(original);
        const out = n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        return sym ? out + ' ' + sym : out;
      }

      function formatPercent(n, decimals = 0) {
        if (!Number.isFinite(n)) return '';
        return n.toFixed(decimals) + '%';
      }

      function detectCurrencySymbol(original) {
        if (typeof original === 'string') {
          if (original.includes('€')) return '€';
          if (original.includes('$')) return '$';
          if (original.includes('£')) return '£';
        }
        return '';
      }

    })();
  </script>
</body>
