<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock History</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --border: #e5e7eb;
      --muted: #6b7280;
      --accent: #4f46e5;
      --error: #b91c1c;
      --success: #16a34a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial,
        "Apple Color Emoji", "Segoe UI Emoji";
      background: var(--bg);
      color: #0f172a;
      line-height: 1.5;
    }
    .container {
      max-width: 1200px;
      margin: 24px auto;
      padding: 0 16px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 1.2rem;
      margin: 0;
      font-weight: 700;
    }
    a.btn-link { color: var(--accent); text-decoration: none; }
    a.btn-link:hover { text-decoration: underline; }

    .table-wrapper {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .table-meta { padding: 10px 12px; color: var(--muted); font-size: 13px; border-bottom: 1px solid var(--border); }
    .table-container { width: 100%; overflow: auto; max-height: 80vh; }

    table { width: 100%; border-collapse: collapse; }
    thead th { position: sticky; top: 0; background: #f8fafc; z-index: 1; border-bottom: 1px solid var(--border); }
    th, td { padding: 10px 12px; font-size: 14px; text-align: left; white-space: nowrap; }
    tbody tr:nth-child(even) td { background: #fcfcfd; }
    tbody tr:hover td { background: #f7f8fb; }

    .message { padding: 12px 16px; margin: 12px 0; border-radius: 8px; font-size: 14px; }
    .message.error { background: #fee; color: var(--error); border: 1px solid #fcc; }
    .message.info { background: #eef; color: var(--accent); border: 1px solid #ccf; }
    .cell-negative { color: var(--error) !important; }
    .cell-positive { color: var(--success) !important; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1 id="title">Stock History</h1>
      <a href="/" class="btn-link">← Back to app</a>
    </header>
    <div id="messages"></div>
    <section class="table-wrapper">
      <div id="meta" class="table-meta"></div>
      <div id="tableContainer" class="table-container"></div>
    </section>
  </div>

  <script>
    (function(){
      'use strict';
      const API_BASE = '/api';
      const params = new URLSearchParams(location.search);
      const stockName = params.get('name') || '';

      const messages = document.getElementById('messages');
      const meta = document.getElementById('meta');
      const tableContainer = document.getElementById('tableContainer');

      document.getElementById('title').textContent = stockName ? `Stock History — ${stockName}` : 'Stock History';

      function showMessage(msg, type = 'info') {
        const div = document.createElement('div');
        div.className = `message ${type}`;
        div.textContent = msg;
        messages.innerHTML = '';
        messages.appendChild(div);
      }

      function formatMoney(n) {
        if (!Number.isFinite(n)) return '';
        return n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }
      function formatPercent(n, decimals = 2) {
        if (!Number.isFinite(n)) return '';
        return n.toFixed(decimals) + '%';
      }
      function formatNumber(n, decimals = 2) {
        if (!Number.isFinite(n)) return '';
        return n.toFixed(decimals);
      }
      function formatDate(val) {
        const d = new Date(val);
        return isNaN(d.getTime()) ? String(val) : d.toLocaleString();
      }

      function buildTable(headers, rows) {
        const table = document.createElement('table');
        const thead = document.createElement('thead');
        const trh = document.createElement('tr');
        for (const h of headers) {
          const th = document.createElement('th');
          th.textContent = h;
          trh.appendChild(th);
        }
        thead.appendChild(trh);
        table.appendChild(thead);

        const tbody = document.createElement('tbody');
        for (const row of rows) {
          const tr = document.createElement('tr');
          for (const cell of row) {
            const td = document.createElement('td');
            if (cell && typeof cell === 'object' && 'text' in cell) {
              td.textContent = cell.text;
              if (cell.className) td.className = cell.className;
              if (cell.title) td.title = cell.title;
            } else {
              td.textContent = cell;
            }
            tr.appendChild(td);
          }
          tbody.appendChild(tr);
        }
        table.appendChild(tbody);
        return table;
      }

      async function loadHistory() {
        if (!stockName) {
          showMessage('Missing stock name in URL. Example: /stock_history.html?name=AAPL', 'error');
          return;
        }
        showMessage('Loading history...', 'info');
        try {
          const res = await fetch(`${API_BASE}/stock_history?name=${encodeURIComponent(stockName)}`);
          const data = await res.json();
          if (!res.ok) {
            showMessage(`Error: ${data.error || 'Failed to load'}`, 'error');
            return;
          }

          const headers = [
            'Date','Current','Target','Growth %','Appeal','Buy %','Hold %','Sell %','Relative %','Absolute','Daily %','Cap','Trend'
          ];
          const rows = (data.records || []).map(r => [
            formatDate(r.date),
            formatMoney(Number(r.current)),
            formatMoney(Number(r.target)),
            formatPercent(Number(r.growth)),
            formatNumber(Number(r.appeal), 2),
            formatPercent(Number(r.buy), 0),
            formatPercent(Number(r.hold), 0),
            formatPercent(Number(r.sell), 0),
            formatPercent(Number(r.relative)),
            formatMoney(Number(r.absolute)),
            formatPercent(Number(r.daily_change)),
            r.cap || '',
            r.trend || ''
          ]);

          messages.innerHTML = '';
          tableContainer.innerHTML = '';
          const table = buildTable(headers, rows);
          tableContainer.appendChild(table);
          meta.textContent = `${rows.length.toLocaleString()} record${rows.length === 1 ? '' : 's'} for ${stockName}`;
        } catch (err) {
          showMessage(`Failed to load: ${err.message}`, 'error');
        }
      }

      loadHistory();
    })();
  </script>
</body>
</html>
